server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы /api/ уходят в контейнер backend: фронт и API на одном origin, CORS не участвует.
    location /api/ {
        # Адрес без пути на конце: запрос уходит на backend с исходным префиксом /api.
        proxy_pass http://backend:8000;
    }

    # SPA: любой неизвестный путь (/login, /resources) отдаёт index.html, маршрут разбирает react-router.
    location / {
        try_files $uri /index.html;
    }
}
